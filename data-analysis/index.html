<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>数据分析学习路径 - 米奇妙妙屋</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script>
    // Detect if running in iframe
    if (window.self !== window.top) {
      document.documentElement.classList.add('in-iframe');
    }
  </script>
  <style>
    html.in-iframe .back-link { display: none !important; }

    /* ============================================================
       数据分析学习路径 - 专属侧边导航
       继承原站 Glass Morphism + 低饱和配色风格
       并扩展侧边栏多级折叠交互
       ============================================================ */

    :root {
      --primary: #6B7CFF;
      --primary-soft: rgba(107, 124, 255, 0.08);
      --primary-10: rgba(107, 124, 255, 0.12);
      --primary-20: rgba(107, 124, 255, 0.25);
      --primary-60: rgba(107, 124, 255, 0.60);
      --glass-bg: rgba(255, 255, 255, 0.55);
      --glass-border: rgba(255, 255, 255, 0.65);
      --glass-highlight: rgba(255, 255, 255, 0.85);
      --glass-shadow: rgba(107, 124, 255, 0.06);
      --bg-base: #EDE8F5;
      --bg-card: rgba(255, 255, 255, 0.60);
      --bg-hover: rgba(255, 255, 255, 0.75);
      --bg-active: rgba(255, 255, 255, 0.50);
      --text-title: #2D2B55;
      --text-body: #5A5678;
      --text-muted: #9B97B3;
      --text-inverse: #FFFFFF;
      --border: rgba(255, 255, 255, 0.50);
      --border-light: rgba(255, 255, 255, 0.35);
      --success: #7DD3A8;
      --success-bg: rgba(125, 211, 168, 0.12);
      --warning: #F5B87A;
      --warning-bg: rgba(245, 184, 122, 0.12);
      --error: #F0939A;
      --error-bg: rgba(240, 147, 154, 0.12);
      --radius-xs: 8px;
      --radius-sm: 14px;
      --radius-lg: 24px;
      --radius-pill: 999px;
      --shadow-sm: 0 2px 8px rgba(107, 124, 255, 0.06), 0 0 1px rgba(107, 124, 255, 0.04);
      --shadow-md: 0 6px 20px rgba(107, 124, 255, 0.08), 0 0 1px rgba(107, 124, 255, 0.05);
      --shadow-lg: 0 12px 32px rgba(107, 124, 255, 0.10), 0 0 1px rgba(107, 124, 255, 0.06);
      --shadow-hover: 0 16px 40px rgba(107, 124, 255, 0.14), 0 0 1px rgba(107, 124, 255, 0.08);
      --font-sans: 'Inter', 'Noto Sans SC', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --font-mono: 'SF Mono', 'Fira Code', Monaco, 'Cascadia Code', monospace;
      --transition-fast: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      --transition-base: 0.35s cubic-bezier(0.4, 0, 0.2, 1);
      --transition-slow: 0.5s cubic-bezier(0.4, 0, 0.2, 1);
      --sidebar-w: 280px;
    }

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html { font-size: 16px; -webkit-font-smoothing: antialiased; }
    body {
      font-family: var(--font-sans);
      background: linear-gradient(135deg, #EDE8F5 0%, #F5E8F0 30%, #E8E8F8 60%, #F0E8F5 100%);
      background-attachment: fixed;
      color: var(--text-body);
      line-height: 1.6;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ---------- App Layout ---------- */
    .app-container { display: flex; min-height: 100vh; }

    /* ---------- Sidebar (Data Analysis Special) ---------- */
    .sidebar {
      width: var(--sidebar-w);
      background: rgba(255, 255, 255, 0.45);
      backdrop-filter: blur(40px) saturate(200%);
      -webkit-backdrop-filter: blur(40px) saturate(200%);
      border-right: 1px solid rgba(255, 255, 255, 0.60);
      padding: 24px 16px;
      position: fixed;
      height: 100vh;
      overflow-y: auto;
      z-index: 100;
      display: flex;
      flex-direction: column;
      box-shadow: 4px 0 24px rgba(107, 124, 255, 0.08);
    }

    .sidebar-brand {
      font-size: 17px;
      font-weight: 600;
      color: var(--text-title);
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      gap: 10px;
      letter-spacing: -0.01em;
    }
    .brand-mark {
      width: 38px;
      height: 38px;
      background: linear-gradient(135deg, #A78BFA 0%, #8B7CF8 50%, #7C73E6 100%);
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-inverse);
      font-size: 18px;
      font-weight: 500;
      flex-shrink: 0;
      box-shadow: 0 4px 16px rgba(139, 124, 248, 0.30), inset 0 1px 1px rgba(255,255,255,0.3);
      transition: transform var(--transition-base), box-shadow var(--transition-base);
    }
    .sidebar-brand:hover .brand-mark {
      transform: scale(1.08) rotate(-3deg);
      box-shadow: 0 6px 20px rgba(139, 124, 248, 0.40), inset 0 1px 1px rgba(255,255,255,0.3);
    }
    .sidebar-subtitle {
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 20px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
      font-weight: 400;
    }
    .back-link {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      margin-bottom: 12px;
      border-radius: var(--radius-sm);
      color: var(--primary);
      text-decoration: none;
      font-size: 13px;
      font-weight: 500;
      background: var(--primary-soft);
      border: 1px solid var(--primary-10);
      transition: all var(--transition-fast);
      cursor: pointer;
    }
    .back-link:hover {
      background: var(--primary-10);
      transform: translateX(-2px);
    }

    /* ---------- Nav Menu ---------- */
    .nav-menu { list-style: none; display: flex; flex-direction: column; gap: 2px; }

    .nav-item { position: relative; }

    .nav-link {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      border-radius: var(--radius-sm);
      color: var(--text-muted);
      text-decoration: none;
      font-size: 13px;
      font-weight: 400;
      cursor: pointer;
      transition: all var(--transition-base);
      border: none;
      background: transparent;
      width: 100%;
      position: relative;
      overflow: hidden;
    }
    .nav-link::before {
      content: '';
      position: absolute;
      left: 0;
      top: 50%;
      transform: translateY(-50%);
      width: 3px;
      height: 0;
      background: linear-gradient(180deg, #A78BFA, #8B7CF8);
      border-radius: 0 2px 2px 0;
      transition: height var(--transition-base);
    }
    .nav-link:hover {
      background: rgba(255, 255, 255, 0.50);
      color: var(--text-body);
      box-shadow: 0 2px 8px rgba(107, 124, 255, 0.06);
    }
    .nav-link:hover::before { height: 18px; }
    .nav-link.active {
      background: rgba(255, 255, 255, 0.70);
      color: var(--primary);
      font-weight: 500;
      box-shadow: 0 2px 12px rgba(107, 124, 255, 0.10);
    }
    .nav-link.active::before { height: 22px; }
    .nav-icon {
      width: 20px;
      height: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      color: var(--text-muted);
      transition: color var(--transition-base), transform var(--transition-fast);
      flex-shrink: 0;
    }
    .nav-link.active .nav-icon { color: var(--primary); }
    .nav-link:hover .nav-icon { transform: scale(1.1); }

    /* ---------- Collapsible Groups ---------- */
    .nav-group {
      margin-bottom: 4px;
    }
    .nav-group-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      border-radius: var(--radius-sm);
      color: var(--text-title);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all var(--transition-base);
      border: none;
      background: transparent;
      width: 100%;
      user-select: none;
    }
    .nav-group-header:hover {
      background: rgba(255, 255, 255, 0.50);
      box-shadow: 0 2px 8px rgba(107, 124, 255, 0.06);
    }
    .nav-group-header .group-icon {
      font-size: 15px;
      margin-right: 6px;
    }
    .nav-group-header .group-text {
      flex: 1;
      text-align: left;
    }
    .nav-group-header .expand-icon {
      font-size: 11px;
      color: var(--text-muted);
      transition: transform var(--transition-base);
      flex-shrink: 0;
    }
    .nav-group-header.expanded .expand-icon {
      transform: rotate(180deg);
    }
    .nav-group-children {
      display: none;
      padding-left: 8px;
      margin-top: 2px;
      animation: fadeIn 0.25s ease;
    }
    .nav-group-children.open { display: block; }

    .nav-child-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 12px 8px 28px;
      border-radius: var(--radius-sm);
      color: var(--text-muted);
      text-decoration: none;
      font-size: 12px;
      font-weight: 400;
      cursor: pointer;
      transition: all var(--transition-base);
      border: none;
      background: transparent;
      width: 100%;
      position: relative;
      margin-bottom: 2px;
    }
    .nav-child-item::before {
      content: '';
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: var(--text-muted);
      opacity: 0.4;
      transition: all var(--transition-base);
    }
    .nav-child-item:hover {
      background: rgba(255, 255, 255, 0.45);
      color: var(--text-body);
    }
    .nav-child-item:hover::before {
      background: var(--primary);
      opacity: 1;
      transform: translateY(-50%) scale(1.3);
    }
    .nav-child-item.active {
      background: rgba(255, 255, 255, 0.60);
      color: var(--primary);
      font-weight: 500;
    }
    .nav-child-item.active::before {
      background: var(--primary);
      opacity: 1;
      width: 5px;
      height: 5px;
    }
    .nav-child-item .diff-tag {
      font-size: 10px;
      padding: 2px 7px;
      border-radius: 10px;
      font-weight: 500;
      flex-shrink: 0;
      margin-left: 6px;
    }
    .diff-tag.beginner { background: var(--success-bg); color: #2aa876; border: 1px solid rgba(54, 211, 153, 0.15); }
    .diff-tag.intermediate { background: var(--warning-bg); color: #e0852e; border: 1px solid rgba(255, 159, 67, 0.15); }
    .diff-tag.advanced { background: var(--error-bg); color: #e05555; border: 1px solid rgba(248, 114, 114, 0.15); }

    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    /* ---------- Main Content ---------- */
    .main-content {
      flex: 1;
      margin-left: var(--sidebar-w);
      padding: 32px 40px;
      max-width: 1200px;
    }

    .page { display: none; }
    .page.active { display: block !important; animation: pageEnter 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
    @keyframes pageEnter {
      from { opacity: 0; transform: translateY(12px) scale(0.995); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    .page-title {
      font-size: 24px;
      font-weight: 600;
      margin-bottom: 6px;
      color: var(--text-title);
      letter-spacing: -0.02em;
    }
    .page-subtitle {
      font-size: 14px;
      color: var(--text-muted);
      margin-bottom: 28px;
      font-weight: 400;
    }

    /* ---------- Cards ---------- */
    .card {
      background: rgba(255, 255, 255, 0.55);
      backdrop-filter: blur(32px) saturate(180%);
      -webkit-backdrop-filter: blur(32px) saturate(180%);
      border-radius: var(--radius-lg);
      border: 1px solid rgba(255, 255, 255, 0.70);
      padding: 28px;
      margin-bottom: 20px;
      box-shadow: 0 4px 16px rgba(107, 124, 255, 0.06), inset 0 1px 1px rgba(255,255,255,0.6);
      transition: all var(--transition-base);
      position: relative;
      overflow: hidden;
    }
    .card::after {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; height: 2px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.9), transparent);
      pointer-events: none;
    }
    .card:hover {
      box-shadow: 0 8px 24px rgba(107, 124, 255, 0.10), inset 0 1px 1px rgba(255,255,255,0.6);
      transform: translateY(-3px);
      border-color: rgba(255, 255, 255, 0.85);
      background: rgba(255, 255, 255, 0.65);
    }
    .card-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
    .card-title { font-size: 15px; font-weight: 600; color: var(--text-title); letter-spacing: -0.01em; }

    /* ---------- Content Section Card ---------- */
    .content-section {
      background: rgba(255, 255, 255, 0.55);
      backdrop-filter: blur(32px) saturate(180%);
      border-radius: var(--radius-lg);
      border: 1px solid rgba(255, 255, 255, 0.70);
      padding: 28px;
      margin-bottom: 20px;
      box-shadow: 0 4px 16px rgba(107, 124, 255, 0.06), inset 0 1px 1px rgba(255,255,255,0.6);
    }
    .section-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border-light);
    }
    .section-icon {
      width: 40px;
      height: 40px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      flex-shrink: 0;
      background: linear-gradient(135deg, #A78BFA 0%, #8B7CF8 100%);
      color: #fff;
      box-shadow: 0 4px 12px rgba(139, 124, 248, 0.25);
    }
    .section-title-wrap { flex: 1; }
    .section-title {
      font-size: 18px;
      font-weight: 600;
      color: var(--text-title);
      margin-bottom: 2px;
    }
    .section-desc { font-size: 13px; color: var(--text-muted); }
    .diff-badge {
      display: inline-flex;
      align-items: center;
      padding: 5px 14px;
      border-radius: var(--radius-pill);
      font-size: 12px;
      font-weight: 500;
    }
    .badge-beginner { background: var(--success-bg); color: #2aa876; border: 1px solid rgba(54, 211, 153, 0.15); }
    .badge-intermediate { background: var(--warning-bg); color: #e0852e; border: 1px solid rgba(255, 159, 67, 0.15); }
    .badge-advanced { background: var(--error-bg); color: #e05555; border: 1px solid rgba(248, 114, 114, 0.15); }

    /* ---------- Knowledge Grid ---------- */
    .knowledge-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      margin-bottom: 24px;
    }
    .knowledge-card {
      background: rgba(255, 255, 255, 0.45);
      backdrop-filter: blur(20px) saturate(160%);
      border: 1px solid rgba(255, 255, 255, 0.60);
      border-radius: var(--radius-sm);
      padding: 20px;
      transition: all var(--transition-base);
      box-shadow: inset 0 1px 1px rgba(255,255,255,0.5), 0 2px 8px rgba(107, 124, 255, 0.04);
    }
    .knowledge-card:hover {
      background: rgba(255, 255, 255, 0.65);
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(107, 124, 255, 0.08), inset 0 1px 1px rgba(255,255,255,0.5);
      border-color: rgba(255, 255, 255, 0.80);
    }
    .knowledge-card-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-title);
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .knowledge-card-title::before {
      content: '';
      width: 3px;
      height: 16px;
      background: linear-gradient(180deg, #A78BFA, #8B7CF8);
      border-radius: 2px;
      flex-shrink: 0;
    }
    .knowledge-card ul {
      list-style: none;
      padding: 0;
      margin: 0;
    }
    .knowledge-card li {
      font-size: 13px;
      color: var(--text-body);
      line-height: 1.8;
      padding-left: 16px;
      position: relative;
    }
    .knowledge-card li::before {
      content: '•';
      position: absolute;
      left: 0;
      color: var(--primary);
      font-weight: 700;
    }

    /* ---------- Resources ---------- */
    .resource-list { display: flex; flex-direction: column; gap: 10px; }
    .resource-item {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 18px;
      background: rgba(255, 255, 255, 0.50);
      backdrop-filter: blur(24px) saturate(140%);
      border: 1px solid rgba(255, 255, 255, 0.65);
      border-radius: var(--radius-sm);
      text-decoration: none;
      color: inherit;
      transition: all var(--transition-base);
      box-shadow: 0 2px 8px rgba(107, 124, 255, 0.04), inset 0 1px 1px rgba(255,255,255,0.5);
    }
    .resource-item:hover {
      border-color: rgba(255, 255, 255, 0.80);
      box-shadow: 0 6px 16px rgba(107, 124, 255, 0.08), inset 0 1px 1px rgba(255,255,255,0.5);
      transform: translateY(-2px);
      background: rgba(255, 255, 255, 0.60);
    }
    .resource-icon {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      flex-shrink: 0;
      background: rgba(139, 124, 248, 0.10);
      color: #8B7CF8;
      border: 1px solid rgba(139, 124, 248, 0.15);
      transition: all var(--transition-fast);
    }
    .resource-item:hover .resource-icon { transform: scale(1.08) rotate(-3deg); box-shadow: 0 4px 12px rgba(139, 124, 248, 0.20); }
    .resource-info { flex: 1; }
    .resource-name { font-size: 14px; font-weight: 500; margin-bottom: 2px; color: var(--text-title); }
    .resource-desc { font-size: 12px; color: var(--text-muted); line-height: 1.5; }
    .resource-tag {
      font-size: 11px;
      padding: 4px 10px;
      border-radius: var(--radius-xs);
      background: rgba(242, 243, 245, 0.60);
      color: var(--text-muted);
      white-space: nowrap;
      font-weight: 500;
      border: 1px solid rgba(229, 230, 235, 0.40);
    }
    .resource-item:hover .resource-tag { background: var(--primary-soft); color: var(--primary); border-color: var(--primary-10); }

    /* ---------- Exercises ---------- */
    .exercise-list { display: flex; flex-direction: column; gap: 14px; }
    .exercise-card {
      background: rgba(255, 255, 255, 0.50);
      border: 1px solid rgba(255, 255, 255, 0.65);
      border-radius: var(--radius-sm);
      padding: 20px;
      transition: all var(--transition-fast);
      box-shadow: inset 0 1px 1px rgba(255,255,255,0.5), 0 2px 8px rgba(107, 124, 255, 0.04);
    }
    .exercise-card:hover {
      border-color: rgba(139, 124, 248, 0.25);
      background: rgba(255, 255, 255, 0.65);
    }
    .exercise-num {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 28px;
      background: var(--primary-soft);
      color: var(--primary);
      font-size: 12px;
      font-weight: 700;
      border-radius: 50%;
      margin-right: 10px;
      flex-shrink: 0;
    }
    .exercise-question {
      font-size: 14px;
      color: var(--text-title);
      line-height: 1.7;
      margin-bottom: 14px;
      display: flex;
      align-items: flex-start;
    }
    .exercise-answer {
      display: none;
      font-size: 13px;
      color: var(--text-body);
      line-height: 1.8;
      background: rgba(54, 211, 153, 0.04);
      border: 1px solid rgba(54, 211, 153, 0.12);
      border-radius: var(--radius-xs);
      padding: 14px 18px;
      animation: fadeIn 0.25s ease;
    }
    .exercise-answer.open { display: block; }
    .exercise-answer::before {
      content: 'A.';
      display: inline-block;
      width: 22px;
      height: 22px;
      background: var(--success-bg);
      color: #2aa876;
      font-size: 11px;
      font-weight: 700;
      border-radius: 50%;
      text-align: center;
      line-height: 22px;
      margin-right: 8px;
      flex-shrink: 0;
    }
    .btn-answer {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 14px;
      background: rgba(22, 93, 255, 0.06);
      border: 1px solid var(--primary-20);
      border-radius: var(--radius-xs);
      color: var(--primary);
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: all var(--transition-fast);
    }
    .btn-answer:hover { background: var(--primary-soft); transform: translateY(-1px); }
    .btn-answer.active { background: var(--success-bg); border-color: rgba(54, 211, 153, 0.25); color: #2aa876; }

    /* ---------- Buttons ---------- */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px 28px;
      border-radius: var(--radius-pill);
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      border: none;
      transition: all var(--transition-base);
      letter-spacing: 0.01em;
      line-height: 1.5;
      position: relative;
      overflow: hidden;
    }
    .btn-primary {
      background: linear-gradient(135deg, #8B7CF8 0%, #A78BFA 50%, #C4B5FD 100%);
      color: var(--text-inverse);
      box-shadow: 0 4px 16px rgba(139, 124, 248, 0.35), inset 0 1px 1px rgba(255,255,255,0.3);
    }
    .btn-primary:hover {
      background: linear-gradient(135deg, #7C6DE8 0%, #9B7CF0 50%, #B8A5F5 100%);
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(139, 124, 248, 0.40), inset 0 1px 1px rgba(255,255,255,0.3);
    }

    /* ---------- Progress Bar ---------- */
    .progress-container { margin-bottom: 24px; }
    .progress-label { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 10px; color: var(--text-body); }
    .progress-label span:last-child { color: var(--text-muted); }
    .progress-bar { height: 8px; background: rgba(255, 255, 255, 0.45); border-radius: var(--radius-pill); overflow: hidden; position: relative; border: 1px solid rgba(255, 255, 255, 0.40); }
    .progress-fill { height: 100%; background: linear-gradient(90deg, #8B7CF8, #A78BFA, #C4B5FD); border-radius: var(--radius-pill); transition: width 0.8s cubic-bezier(0.4, 0, 0.2, 1); position: relative; overflow: hidden; }
    .progress-fill::after { content: ''; position: absolute; top: 0; left: -100%; width: 50%; height: 100%; background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent); animation: shimmer 3s ease-in-out infinite; }
    @keyframes shimmer { 0% { left: -100%; } 50% { left: 150%; } 100% { left: 150%; } }

    /* ---------- Home / Overview Page ---------- */
    .overview-hero {
      background: linear-gradient(135deg, rgba(255,255,255,0.65) 0%, rgba(255,255,255,0.50) 100%);
      backdrop-filter: blur(32px) saturate(180%);
      border: 1px solid rgba(255, 255, 255, 0.70);
      border-radius: var(--radius-lg);
      padding: 32px;
      margin-bottom: 24px;
      box-shadow: 0 6px 20px rgba(107, 124, 255, 0.08), inset 0 1px 1px rgba(255,255,255,0.6);
      position: relative;
      overflow: hidden;
      transition: all var(--transition-base);
    }
    .overview-hero:hover {
      box-shadow: 0 10px 32px rgba(107, 124, 255, 0.12), inset 0 1px 1px rgba(255,255,255,0.6);
      transform: translateY(-3px);
    }
    .overview-hero::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; height: 3px;
      background: linear-gradient(90deg, #A78BFA, #8B7CF8, #C4B5FD);
      background-size: 200% 100%;
      animation: gradientShift 4s ease infinite;
    }
    @keyframes gradientShift { 0%, 100% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } }
    .overview-hero h2 { font-size: 20px; font-weight: 600; color: var(--text-title); margin-bottom: 10px; }
    .overview-hero p { font-size: 14px; color: var(--text-body); line-height: 1.8; }
    .overview-hero .hero-stats { display: flex; gap: 24px; margin-top: 20px; flex-wrap: wrap; }
    .hero-stat { text-align: center; }
    .hero-stat .val { font-size: 28px; font-weight: 300; background: linear-gradient(135deg, #8B7CF8, #A78BFA); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; font-family: var(--font-mono); }
    .hero-stat .lbl { font-size: 12px; color: var(--text-muted); margin-top: 4px; }

    .pathway-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; margin-bottom: 24px; }
    .pathway-card {
      background: rgba(255, 255, 255, 0.50);
      backdrop-filter: blur(28px) saturate(160%);
      border-radius: var(--radius-lg);
      border: 1px solid rgba(255, 255, 255, 0.65);
      padding: 24px;
      box-shadow: 0 4px 16px rgba(107, 124, 255, 0.05), inset 0 1px 1px rgba(255,255,255,0.5);
      transition: all var(--transition-base);
      cursor: pointer;
    }
    .pathway-card:hover {
      box-shadow: 0 8px 24px rgba(107, 124, 255, 0.10), inset 0 1px 1px rgba(255,255,255,0.6);
      transform: translateY(-3px);
      border-color: rgba(255, 255, 255, 0.80);
      background: rgba(255, 255, 255, 0.60);
    }
    .pathway-card .path-icon { font-size: 32px; margin-bottom: 12px; }
    .pathway-card .path-title { font-size: 16px; font-weight: 600; color: var(--text-title); margin-bottom: 6px; }
    .pathway-card .path-desc { font-size: 13px; color: var(--text-muted); line-height: 1.6; }
    .pathway-card .path-tags { display: flex; gap: 6px; margin-top: 12px; flex-wrap: wrap; }
    .path-tag { font-size: 11px; padding: 3px 10px; border-radius: var(--radius-xs); background: rgba(242, 243, 245, 0.60); color: var(--text-muted); border: 1px solid rgba(229, 230, 235, 0.40); }

    /* ---------- Responsive ---------- */
    @media (max-width: 1024px) {
      .main-content { padding: 28px; margin-left: var(--sidebar-w); }
      .knowledge-grid { grid-template-columns: repeat(2, 1fr); }
      .pathway-grid { grid-template-columns: 1fr; }
    }
    @media (max-width: 768px) {
      .sidebar { display: none; }
      .main-content { margin-left: 0; padding: 20px 16px 90px; max-width: 100%; }
      .knowledge-grid { grid-template-columns: 1fr; }
      .mobile-nav { display: flex; }
    }
    .mobile-nav {
      display: none;
      position: fixed;
      bottom: 0;
      left: 0; right: 0;
      background: rgba(255, 255, 255, 0.45);
      backdrop-filter: blur(32px) saturate(180%);
      border-top: 1px solid rgba(255, 255, 255, 0.60);
      padding: 6px 0 calc(6px + env(safe-area-inset-bottom));
      z-index: 100;
      justify-content: space-around;
      box-shadow: 0 -4px 20px rgba(107, 124, 255, 0.06);
    }
    .mobile-nav-link {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      padding: 4px 8px;
      color: var(--text-muted);
      text-decoration: none;
      font-size: 10px;
      transition: all var(--transition-base);
      border: none;
      background: transparent;
      cursor: pointer;
    }
    .mobile-nav-link.active { color: var(--primary); }
    .mobile-nav-icon { font-size: 20px; line-height: 1; }

    /* ---------- Misc ---------- */
    .tag {
      display: inline-flex;
      align-items: center;
      padding: 3px 10px;
      border-radius: var(--radius-xs);
      font-size: 12px;
      font-weight: 500;
    }
    .tag-blue { background: var(--primary-soft); color: var(--primary); border: 1px solid var(--primary-10); }
    .tag-green { background: var(--success-bg); color: #2aa876; border: 1px solid rgba(54, 211, 153, 0.15); }
    .tag-orange { background: var(--warning-bg); color: #e0852e; border: 1px solid rgba(255, 159, 67, 0.15); }
    .tag-red { background: var(--error-bg); color: #e05555; border: 1px solid rgba(248, 114, 114, 0.15); }
    .tag-gray { background: rgba(242, 243, 245, 0.60); color: var(--text-muted); border: 1px solid rgba(229, 230, 235, 0.40); }
    .toast {
      position: fixed;
      bottom: 28px; right: 28px;
      background: rgba(29, 33, 41, 0.92);
      backdrop-filter: blur(16px);
      color: var(--text-inverse);
      padding: 14px 22px;
      border-radius: var(--radius-sm);
      font-size: 14px;
      box-shadow: var(--shadow-lg);
      z-index: 1000;
      animation: toastSlideIn 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      font-weight: 400;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    @keyframes toastSlideIn { from { transform: translateX(100%) scale(0.90); opacity: 0; } to { transform: translateX(0) scale(1); opacity: 1; } }

    /* ============================================================
       阶梯式递进学习体系 - Ladder Module System
       ============================================================ */
    .learning-ladder {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .ladder-module {
      background: rgba(255, 255, 255, 0.50);
      backdrop-filter: blur(20px) saturate(160%);
      border: 1px solid rgba(255, 255, 255, 0.65);
      border-radius: var(--radius-lg);
      overflow: hidden;
      transition: all var(--transition-base);
      box-shadow: var(--shadow-sm);
    }
    .ladder-module:hover {
      box-shadow: var(--shadow-md);
      border-color: rgba(255, 255, 255, 0.80);
    }
    .ladder-module.expanded {
      box-shadow: var(--shadow-lg);
      border-color: rgba(167, 139, 250, 0.25);
      background: rgba(255, 255, 255, 0.62);
    }
    .ladder-module-header {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 18px 22px;
      cursor: pointer;
      user-select: none;
      transition: all var(--transition-fast);
      position: relative;
    }
    .ladder-module-header:hover {
      background: rgba(255, 255, 255, 0.35);
    }
    .ladder-step-badge {
      width: 44px;
      height: 44px;
      border-radius: var(--radius-xs);
      background: linear-gradient(135deg, #A78BFA 0%, #8B7CF8 100%);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 700;
      flex-shrink: 0;
      letter-spacing: -0.02em;
      box-shadow: 0 3px 12px rgba(139, 124, 248, 0.25);
      transition: all var(--transition-base);
    }
    .ladder-module.expanded .ladder-step-badge {
      transform: scale(1.06);
      box-shadow: 0 4px 16px rgba(139, 124, 248, 0.35);
    }
    .ladder-module-info {
      flex: 1;
      min-width: 0;
    }
    .ladder-module-title {
      font-size: 15px;
      font-weight: 600;
      color: var(--text-title);
      margin-bottom: 3px;
      letter-spacing: -0.01em;
    }
    .ladder-module-desc {
      font-size: 12px;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .ladder-expand-icon {
      font-size: 12px;
      color: var(--text-muted);
      transition: transform var(--transition-base);
      flex-shrink: 0;
    }
    .ladder-module.expanded .ladder-expand-icon {
      transform: rotate(180deg);
      color: var(--primary);
    }

    .ladder-module-body {
      display: none;
      padding: 0 22px 22px;
      animation: ladderBodyIn 0.35s cubic-bezier(0.4, 0, 0.2, 1);
    }
    @keyframes ladderBodyIn {
      from { opacity: 0; transform: translateY(-8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .ladder-module.expanded .ladder-module-body {
      display: block;
    }

    .ladder-section {
      margin-bottom: 18px;
    }
    .ladder-section:last-child { margin-bottom: 0; }
    .ladder-section-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-title);
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .ladder-section-title .sec-icon { font-size: 15px; }

    /* Knowledge list inside module */
    .ladder-knowledge-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    .ladder-knowledge-list li {
      font-size: 13px;
      color: var(--text-body);
      padding: 6px 12px;
      background: rgba(107, 124, 255, 0.04);
      border-radius: var(--radius-xs);
      line-height: 1.5;
      position: relative;
      padding-left: 24px;
    }
    .ladder-knowledge-list li::before {
      content: '';
      position: absolute;
      left: 10px;
      top: 12px;
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--primary-60);
    }

    /* Resource chips inside module */
    .ladder-resource-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .ladder-resource-chip {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 8px 14px;
      border-radius: var(--radius-pill);
      background: rgba(255, 255, 255, 0.55);
      border: 1px solid rgba(107, 124, 255, 0.12);
      color: var(--text-body);
      text-decoration: none;
      font-size: 12px;
      font-weight: 500;
      transition: all var(--transition-fast);
      white-space: nowrap;
    }
    .ladder-resource-chip:hover {
      background: rgba(107, 124, 255, 0.08);
      border-color: rgba(107, 124, 255, 0.25);
      color: var(--primary);
      transform: translateY(-1px);
      box-shadow: 0 3px 10px rgba(107, 124, 255, 0.08);
    }
    .ladder-resource-chip .chip-icon { font-size: 14px; }

    /* Exercise inside module */
    .ladder-exercise-item {
      background: rgba(107, 124, 255, 0.03);
      border: 1px solid rgba(107, 124, 255, 0.08);
      border-radius: var(--radius-sm);
      padding: 14px 16px;
      margin-bottom: 10px;
    }
    .ladder-exercise-item:last-child { margin-bottom: 0; }
    .ladder-exercise-num {
      display: inline-block;
      width: 22px; height: 22px;
      line-height: 22px;
      text-align: center;
      border-radius: 50%;
      background: linear-gradient(135deg, #8B7CF8, #A78BFA);
      color: #fff;
      font-size: 11px;
      font-weight: 600;
      margin-right: 8px;
      flex-shrink: 0;
    }
    .ladder-exercise-q {
      font-size: 13px;
      color: var(--text-body);
      margin-bottom: 10px;
      line-height: 1.6;
    }
    .ladder-answer-toggle {
      font-size: 12px;
      color: var(--primary);
      cursor: pointer;
      background: none;
      border: 1px solid rgba(107, 124, 255, 0.18);
      padding: 5px 14px;
      border-radius: var(--radius-pill);
      font-weight: 500;
      transition: all var(--transition-fast);
    }
    .ladder-answer-toggle:hover {
      background: rgba(107, 124, 255, 0.08);
      border-color: rgba(107, 124, 255, 0.35);
    }
    .ladder-answer-toggle.active {
      background: rgba(107, 124, 255, 0.10);
      color: #5A4FCF;
    }
    .ladder-answer-body {
      display: none;
      margin-top: 10px;
      padding: 12px 14px;
      background: rgba(107, 124, 255, 0.04);
      border-radius: var(--radius-xs);
      font-size: 13px;
      color: var(--text-body);
      line-height: 1.7;
      border-left: 3px solid rgba(139, 124, 248, 0.40);
    }
    .ladder-answer-body.open { display: block; animation: ladderBodyIn 0.3s ease; }

    /* Difficulty badge inside module header */
    .ladder-diff-badge {
      font-size: 10px;
      padding: 3px 10px;
      border-radius: var(--radius-pill);
      font-weight: 600;
      letter-spacing: 0.02em;
      flex-shrink: 0;
    }
    .ladder-diff-badge.beginner {
      background: rgba(125, 211, 168, 0.15);
      color: #3DA87A;
      border: 1px solid rgba(125, 211, 168, 0.30);
    }
    .ladder-diff-badge.intermediate {
      background: rgba(245, 184, 122, 0.15);
      color: #C07A3D;
      border: 1px solid rgba(245, 184, 122, 0.30);
    }
    .ladder-diff-badge.advanced {
      background: rgba(240, 147, 154, 0.15);
      color: #C04A5A;
      border: 1px solid rgba(240, 147, 154, 0.30);
    }

    @media (max-width: 768px) {
      .ladder-module-header { padding: 14px 16px; gap: 10px; }
      .ladder-step-badge { width: 36px; height: 36px; font-size: 10px; }
      .ladder-module-title { font-size: 14px; }
      .ladder-module-body { padding: 0 14px 16px; }
    }
  </style>

  <script>
    // ---------- Toggle Answer ----------
    function toggleAnswer(btn) {
      const answer = btn.nextElementSibling;
      if (answer.classList.contains('open')) {
        answer.classList.remove('open');
        btn.textContent = '查看答案';
        btn.classList.remove('active');
      } else {
        answer.classList.add('open');
        btn.textContent = '收起答案';
        btn.classList.add('active');
      }
    }

    // ---------- Toggle Sidebar Group ----------
    function toggleGroup(header, event) {
      if (event) event.stopPropagation();
      header.classList.toggle('expanded');
      const children = header.nextElementSibling;
      if (children.classList.contains('open')) {
        children.classList.remove('open');
      } else {
        children.classList.add('open');
      }
    }

    // ---------- Show Page ----------
    function showPage(pageId) {
      // Hide all pages
      document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
      // Show target page
      const targetPage = document.getElementById('page-' + pageId);
      if (targetPage) {
        targetPage.classList.add('active');
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }

      // Update sidebar active state
      document.querySelectorAll('.nav-child-item').forEach(item => {
        item.classList.remove('active');
        if (item.dataset.page === pageId) {
          item.classList.add('active');
          // Expand parent groups
          let parent = item.parentElement;
          while (parent) {
            if (parent.classList.contains('nav-group-children')) {
              parent.classList.add('open');
              const header = parent.previousElementSibling;
              if (header && header.classList.contains('nav-group-header')) {
                header.classList.add('expanded');
              }
            }
            parent = parent.parentElement;
          }
        }
      });

      // Update mobile nav active state
      document.querySelectorAll('.mobile-nav-link').forEach(link => {
        link.classList.remove('active');
      });
    }

    // ---------- Toast ----------
    function showToast(message) {
      const toast = document.createElement('div');
      toast.className = 'toast';
      toast.textContent = message;
      document.body.appendChild(toast);
      setTimeout(() => toast.remove(), 3000);
    }

    // ---------- Mobile Menu Toggle ----------
    document.addEventListener('DOMContentLoaded', function() {
      // Auto-expand the first group on load
      const firstGroup = document.querySelector('.nav-group-header');
      if (firstGroup && !firstGroup.classList.contains('expanded')) {
        firstGroup.click();
      }
    });
  </script>
